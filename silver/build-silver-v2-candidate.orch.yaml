type: "orchestration"
version: "1.0"
pipeline:
  metadata:
    description: "DATA-512 candidate run: Creates CLAIMS_CANDIDATE.SILVER schema and runs
      all silver-layer transformations for v2 feed validation. All dim/fact pipelines
      are unchanged except FACT_CLAIM which now reads from REPLICATED.RAW_V2 and writes
      to CLAIMS_CANDIDATE.SILVER. Do NOT use in production until the Prover certifies
      the candidate output."
    origin: "DATA-512"
  components:
    Start:
      type: "start"
      transitions:
        unconditional:
        - "Create CLAIMS_CANDIDATE SILVER Schema"
      parameters:
        componentName: "Start"
    Create CLAIMS_CANDIDATE SILVER Schema:
      type: "sql-executor"
      transitions:
        success:
        - "DIM_PAYER"
        - "DIM_PHARMACY"
        - "DIM_PATIENT"
        - "DIM_PRESCRIBER"
        - "DIM_DRUG"
      parameters:
        componentName: "Create CLAIMS_CANDIDATE SILVER Schema"
        scriptLocation: "Component"
        sqlScript: |
          CREATE DATABASE IF NOT EXISTS "CLAIMS_CANDIDATE";
          CREATE SCHEMA IF NOT EXISTS "CLAIMS_CANDIDATE"."SILVER";
    DIM_PAYER:
      type: "run-transformation"
      transitions:
        success:
        - "Dims Complete"
      parameters:
        componentName: "DIM_PAYER"
        transformationJob: "silver/dim-payer.tran.yaml"
    DIM_PHARMACY:
      type: "run-transformation"
      transitions:
        success:
        - "Dims Complete"
      parameters:
        componentName: "DIM_PHARMACY"
        transformationJob: "silver/dim-pharmacy.tran.yaml"
    DIM_PATIENT:
      type: "run-transformation"
      transitions:
        success:
        - "Dims Complete"
      parameters:
        componentName: "DIM_PATIENT"
        transformationJob: "silver/dim-patient.tran.yaml"
    DIM_PRESCRIBER:
      type: "run-transformation"
      transitions:
        success:
        - "Dims Complete"
      parameters:
        componentName: "DIM_PRESCRIBER"
        transformationJob: "silver/dim-prescriber.tran.yaml"
    DIM_DRUG:
      type: "run-transformation"
      transitions:
        success:
        - "Dims Complete"
      parameters:
        componentName: "DIM_DRUG"
        transformationJob: "silver/dim-drug.tran.yaml"
    Dims Complete:
      type: "and"
      transitions:
        unconditional:
        - "FACT_PRESCRIPTION"
        - "FACT_DISPENSE"
        - "FACT_CLAIM_V2"
        - "FACT_INVENTORY"
      parameters:
        componentName: "Dims Complete"
    FACT_PRESCRIPTION:
      type: "run-transformation"
      transitions:
        success:
        - "Facts Complete"
      parameters:
        componentName: "FACT_PRESCRIPTION"
        transformationJob: "silver/fact-prescription.tran.yaml"
    FACT_DISPENSE:
      type: "run-transformation"
      transitions:
        success:
        - "Facts Complete"
      parameters:
        componentName: "FACT_DISPENSE"
        transformationJob: "silver/fact-dispense.tran.yaml"
    FACT_CLAIM_V2:
      type: "run-transformation"
      transitions:
        success:
        - "Facts Complete"
      parameters:
        componentName: "FACT_CLAIM_V2"
        transformationJob: "silver/fact-claim-v2.tran.yaml"
    FACT_INVENTORY:
      type: "run-transformation"
      transitions:
        success:
        - "Facts Complete"
      parameters:
        componentName: "FACT_INVENTORY"
        transformationJob: "silver/fact-inventory.tran.yaml"
    Facts Complete:
      type: "and"
      parameters:
        componentName: "Facts Complete"
