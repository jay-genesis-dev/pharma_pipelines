type: "transformation"
version: "1.0"
pipeline:
  metadata:
    description: "Silver layer (v2 feed): Deduplicate RAW_V2.RAW_CLAIM into CLAIMS_CANDIDATE.SILVER.FACT_CLAIM.\
      \ Stable output columns preserved; ALLOWED_AMOUNT_USD and PATIENT_RESPONSIBILITY_USD\
      \ added. Source column SUBMITTED_AMOUNT_USD mapped to output SUBMITTED_AMOUNT\
      \ for downstream compatibility."
    origin: "DATA-512"
  components:
    Load RAW_CLAIM v2:
      type: "table-input"
      parameters:
        componentName: "Load RAW_CLAIM v2"
        database: "REPLICATED"
        schema: "RAW_V2"
        targetTable: "RAW_CLAIM"
        columnNames:
        - "CLAIM_ID"
        - "DISPENSE_ID"
        - "PATIENT_ID"
        - "PAYER_ID"
        - "CLAIM_DATE"
        - "CLAIM_STATUS"
        - "SUBMITTED_AMOUNT_USD"
        - "ALLOWED_AMOUNT_USD"
        - "PATIENT_RESPONSIBILITY_USD"
        - "INGREDIENT_COST_PAID"
        - "DISPENSING_FEE_PAID"
        - "COPAY_AMOUNT"
        - "AMOUNT_PAID"
        - "REJECT_CODE"
        - "GROUP_ID"
        - "CDC_OPERATION"
        - "CDC_SEQUENCE"
        - "_LOADED_AT"
    Dedup by CDC:
      type: "rank"
      sources:
      - "Load RAW_CLAIM v2"
      parameters:
        componentName: "Dedup by CDC"
        includeInputColumns: "Yes"
        partitionData:
        - "CLAIM_ID"
        orderingWithinPartitions:
        - - "CDC_SEQUENCE"
          - "Descending"
        functions:
        - - "Row Number"
          - "ROW_NUM"
    Keep Latest Non-Deleted:
      type: "filter"
      sources:
      - "Dedup by CDC"
      parameters:
        componentName: "Keep Latest Non-Deleted"
        mode: "Advanced"
        filterClause: |
          "ROW_NUM" = 1 AND ("CDC_OPERATION" != 'D' OR "CDC_OPERATION" IS NULL)
    Cleanse:
      type: "calculator"
      sources:
      - "Keep Latest Non-Deleted"
      parameters:
        componentName: "Cleanse"
        includeInputColumns: "No"
        calculations:
        # ── Stable identity / dimension columns ──────────────────────────────
        - - |
            "CLAIM_ID"
          - "CLAIM_ID"
        - - |
            "DISPENSE_ID"
          - "DISPENSE_ID"
        - - |
            "PATIENT_ID"
          - "PATIENT_ID"
        - - |
            "PAYER_ID"
          - "PAYER_ID"
        - - |
            "CLAIM_DATE"
          - "CLAIM_DATE"
        - - |
            UPPER(TRIM("CLAIM_STATUS"))
          - "CLAIM_STATUS"
        # ── Amount columns — SUBMITTED_AMOUNT_USD renamed back for compatibility ─
        - - |
            "SUBMITTED_AMOUNT_USD"
          - "SUBMITTED_AMOUNT"
        - - |
            "INGREDIENT_COST_PAID"
          - "INGREDIENT_COST_PAID"
        - - |
            "DISPENSING_FEE_PAID"
          - "DISPENSING_FEE_PAID"
        - - |
            "COPAY_AMOUNT"
          - "COPAY_AMOUNT"
        - - |
            "AMOUNT_PAID"
          - "AMOUNT_PAID"
        # ── Derived columns (unchanged logic) ────────────────────────────────
        - - |
            COALESCE("AMOUNT_PAID", 0) - COALESCE("COPAY_AMOUNT", 0)
          - "NET_PAID"
        - - |
            CASE WHEN "REJECT_CODE" IS NOT NULL THEN TRUE ELSE FALSE END
          - "IS_REJECTED"
        # ── Stable lookup / status columns ───────────────────────────────────
        - - |
            "REJECT_CODE"
          - "REJECT_CODE"
        - - |
            "GROUP_ID"
          - "GROUP_ID"
        # ── New v2 payment detail columns ─────────────────────────────────────
        - - |
            "ALLOWED_AMOUNT_USD"
          - "ALLOWED_AMOUNT_USD"
        - - |
            "PATIENT_RESPONSIBILITY_USD"
          - "PATIENT_RESPONSIBILITY_USD"
        # ── Audit timestamps ──────────────────────────────────────────────────
        - - |
            "_LOADED_AT"
          - "SOURCE_LOADED_AT"
        - - |
            CURRENT_TIMESTAMP()
          - "SILVER_PROCESSED_AT"
    Write FACT_CLAIM:
      type: "rewrite-table"
      sources:
      - "Cleanse"
      parameters:
        componentName: "Write FACT_CLAIM"
        warehouse: "[Environment Default]"
        database: "CLAIMS_CANDIDATE"
        schema: "SILVER"
        targetTable: "FACT_CLAIM"
design:
  components:
    Load RAW_CLAIM v2:
      position:
        x: 0
        "y": 0
      tempMetlId:
    Dedup by CDC:
      position:
        x: 160
        "y": 0
      tempMetlId:
    Keep Latest Non-Deleted:
      position:
        x: 320
        "y": 0
      tempMetlId:
    Cleanse:
      position:
        x: 480
        "y": 0
      tempMetlId:
    Write FACT_CLAIM:
      position:
        x: 640
        "y": 0
      tempMetlId:
