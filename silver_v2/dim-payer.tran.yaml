type: "transformation"
version: "1.0"
pipeline:
  metadata:
    description: "Silver layer: Deduplicate and cleanse RAW_PAYER into DIM_PAYER"
    origin: "data-512-claims-feed-v2"
  components:
    Load RAW_PAYER:
      type: "table-input"
      parameters:
        componentName: "Load RAW_PAYER"
        database: "REPLICATED"
        schema: "RAW"
        targetTable: "RAW_PAYER"
        columnNames:
        - "PAYER_ID"
        - "PAYER_NAME"
        - "PAYER_TYPE"
        - "BIN"
        - "PCN"
        - "CDC_OPERATION"
        - "CDC_SEQUENCE"
        - "_LOADED_AT"
    Dedup by CDC:
      type: "rank"
      sources:
      - "Load RAW_PAYER"
      parameters:
        componentName: "Dedup by CDC"
        includeInputColumns: "Yes"
        partitionData:
        - "PAYER_ID"
        orderingWithinPartitions:
        - - "CDC_SEQUENCE"
          - "Descending"
        functions:
        - - "Row Number"
          - "ROW_NUM"
    Keep Latest Non-Deleted:
      type: "filter"
      sources:
      - "Dedup by CDC"
      parameters:
        componentName: "Keep Latest Non-Deleted"
        mode: "Advanced"
        filterClause: |
          "ROW_NUM" = 1 AND ("CDC_OPERATION" != 'D' OR "CDC_OPERATION" IS NULL)
    Cleanse:
      type: "calculator"
      sources:
      - "Keep Latest Non-Deleted"
      parameters:
        componentName: "Cleanse"
        includeInputColumns: "No"
        calculations:
        - - |
            "PAYER_ID"
          - "PAYER_ID"
        - - |
            "PAYER_NAME"
          - "PAYER_NAME"
        - - |
            UPPER(TRIM("PAYER_TYPE"))
          - "PAYER_TYPE"
        - - |
            "BIN"
          - "BIN"
        - - |
            "PCN"
          - "PCN"
        - - |
            "_LOADED_AT"
          - "SOURCE_LOADED_AT"
        - - |
            CURRENT_TIMESTAMP()
          - "SILVER_PROCESSED_AT"
    Write DIM_PAYER:
      type: "rewrite-table"
      sources:
      - "Cleanse"
      parameters:
        componentName: "Write DIM_PAYER"
        warehouse: "[Environment Default]"
        database: "CLAIMS_CANDIDATE"
        schema: "SILVER"
        targetTable: "DIM_PAYER"
design:
  components:
    Load RAW_PAYER:
      position:
        x: 0
        "y": 0
      tempMetlId:
    Dedup by CDC:
      position:
        x: 160
        "y": 0
      tempMetlId:
    Keep Latest Non-Deleted:
      position:
        x: 320
        "y": 0
      tempMetlId:
    Cleanse:
      position:
        x: 480
        "y": 0
      tempMetlId:
    Write DIM_PAYER:
      position:
        x: 640
        "y": 0
      tempMetlId:
