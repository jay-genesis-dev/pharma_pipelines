type: "orchestration"
version: "1.0"
pipeline:
  metadata:
    description: "Creates CLAIMS_CANDIDATE.SILVER schema and runs the v2 claims\
      \ transformation pipeline, writing candidate output to CLAIMS_CANDIDATE.SILVER.FACT_CLAIM"
    origin: "data-512-claims-feed-v2"
  components:
    Start:
      type: "start"
      transitions:
        unconditional:
        - "Create CLAIMS_CANDIDATE Schema"
      parameters:
        componentName: "Start"
    Create CLAIMS_CANDIDATE Schema:
      type: "sql-executor"
      transitions:
        success:
        - "FACT_CLAIM_V2"
      parameters:
        componentName: "Create CLAIMS_CANDIDATE Schema"
        scriptLocation: "Component"
        sqlScript: |
          CREATE DATABASE IF NOT EXISTS "CLAIMS_CANDIDATE";
          CREATE SCHEMA IF NOT EXISTS "CLAIMS_CANDIDATE"."SILVER";
    FACT_CLAIM_V2:
      type: "run-transformation"
      transitions:
        success:
        - "Done"
      parameters:
        componentName: "FACT_CLAIM_V2"
        transformationJob: "silver_v2/fact-claim.tran.yaml"
    Done:
      type: "and"
      parameters:
        componentName: "Done"
design:
  components:
    Start:
      position:
        x: 0
        "y": 0
      tempMetlId:
    Create CLAIMS_CANDIDATE Schema:
      position:
        x: 160
        "y": 0
      tempMetlId:
    FACT_CLAIM_V2:
      position:
        x: 320
        "y": 0
      tempMetlId:
    Done:
      position:
        x: 480
        "y": 0
      tempMetlId:
